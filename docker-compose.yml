name: seridotour-local-v2
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seridotour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure uma senha local em .env}
      POSTGRES_DB: seridotour_local
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    restart: unless-stopped
    working_dir: /app/apps/backend
    command: sh -c "npm run prisma:generate && npm run start:dev:docker"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-seridotour}:${POSTGRES_PASSWORD}@postgres:5432/seridotour_local?schema=public
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      CHOKIDAR_USEPOLLING: "true"
      PRISMA_HIDE_UPDATE_MESSAGE: "true"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - backend_workspace_modules:/app/apps/backend/node_modules
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dev
    restart: unless-stopped
    working_dir: /app/apps/frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_workspace_modules:/app/apps/frontend/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started
    stdin_open: true
    tty: true

volumes:
  postgres18_data:
  backend_node_modules:
  backend_workspace_modules:
  frontend_node_modules:
  frontend_workspace_modules:
